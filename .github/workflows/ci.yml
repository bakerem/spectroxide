name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --lib
      - name: Science tests
        run: cargo test --test science_suite
      - name: Convergence tests
        run: cargo test --test convergence_order
      - name: Doc tests
        run: cargo test --doc
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check

  miri-kernel:
    # Machine-checks UB-freedom of the get_unchecked hot loops in kompaneets.rs
    # (Thomas solver, K_old precompute, Newton inner loop) on tiny-N kernel
    # tests. Miri is 100-1000x slower than native so ONLY the small-N
    # `miri_kernel*` and `thomas_solve*` tests run here. See R4.2 in
    # dev/audit/highprec_numerics.md.
    name: Miri (unsafe kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri on kernel tests
        run: cargo +nightly miri test --lib miri_kernel
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
      - name: Miri on Thomas solver
        run: cargo +nightly miri test --lib thomas_solve
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
      - name: Debug-assert kernel tests (exercises debug_assert! guards in CI)
        # The full release-only rule exists because the *whole* suite is slow in
        # debug; these tiny-N kernel tests are fast and are the only place the
        # get_unchecked debug_assert! input validation runs in CI.
        run: cargo test --lib -- miri_kernel thomas_solve

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --release --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Coverage summary
        run: cargo llvm-cov report --release 2>&1 | tail -25

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: cd python && pip install -e ".[plot]"
      - name: Install test dependencies
        run: pip install pytest pytest-cov scipy black
      - name: Black format check
        run: python -m black --check python/spectroxide/
      - name: Test imports
        run: |
          python -c "from spectroxide import greens_function, run_single"
          python -c "from spectroxide.greens import greens_function; dn = greens_function(3.0, 2e5); print(f'G_th(3, 2e5) = {dn:.4e}')"
      - name: Run Python tests with coverage
        run: |
          cd python
          pytest tests/ --cov=spectroxide --cov-report=xml:coverage.xml --cov-report=term-missing -v
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  parity:
    name: Rust-Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: cd python && pip install -e "."
      - name: Install pytest
        run: pip install pytest
      - name: Regenerate parity fixture from current Rust
        run: cargo run --release --example generate_parity_fixtures -- /tmp/parity_fresh.json
      - name: Check committed fixture is current
        run: |
          python - <<'EOF'
          import json
          fresh = json.load(open("/tmp/parity_fresh.json"))
          committed = json.load(open("python/tests/data/parity_fixtures.json"))
          fg = {(g["name"], g["cosmo"]): g for g in fresh["groups"]}
          cg = {(g["name"], g["cosmo"]): g for g in committed["groups"]}
          assert fg.keys() == cg.keys(), (
              f"group mismatch: {fg.keys() ^ cg.keys()}"
          )
          stale = []
          for key, g in fg.items():
              assert g["inputs"] == cg[key]["inputs"], f"stale inputs in {key}"
              # Outputs too: without this the committed golden file can drift
              # silently from Rust, and a Rust-side regression is only visible
              # in the Python-vs-fresh comparison below (R2 mutation audit, A5).
              for i, (fv, cv) in enumerate(zip(g["values"], cg[key]["values"])):
                  for j, (a, b) in enumerate(zip(fv, cv)):
                      if a is None or b is None:
                          if a is not b:
                              stale.append(f"{key}[{i}][{j}]: {b} -> {a}")
                          continue
                      scale = max(abs(a), abs(b))
                      if abs(a - b) > 1e-9 * scale + 1e-300:
                          stale.append(f"{key}[{i}][{j}]: {b:.17g} -> {a:.17g}")
          if stale:
              raise SystemExit(
                  "committed parity fixture is stale (Rust output changed); "
                  "regenerate with `cargo run --release --example "
                  "generate_parity_fixtures -- python/tests/data/parity_fixtures.json`\n"
                  + "\n".join(stale[:20])
                  + (f"\n... and {len(stale) - 20} more" if len(stale) > 20 else "")
              )
          print(f"{len(fg)} groups, inputs and values in sync")
          EOF
      - name: Run parity tests against fresh fixture
        run: |
          cd python
          SPECTROXIDE_PARITY_FIXTURE=/tmp/parity_fresh.json python -m pytest tests/test_parity.py -q

  docs:
    name: Docs build (Sphinx + rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package (for autodoc imports)
        run: cd python && pip install -e ".[plot]"
      - name: Install Sphinx + extensions
        run: pip install -r docs/requirements.txt

      # Fix for: PandocMissing in tutorials/*.nblink
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build site (Sphinx + embedded rustdoc)
        run: make -C docs html
      - name: Verify rustdoc was embedded
        run: test -f docs/_build/html/rust/spectroxide/index.html
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html