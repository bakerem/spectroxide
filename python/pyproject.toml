[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spectroxide"
version = "0.1.0"
description = "Python API for CMB spectral distortion calculations"
# readme = "../README.md"  # outside package dir; omitted for setuptools compatibility
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "Ethan Baker" },
    { name = "Hongwan Liu" },
    { name = "Siddharth Mishra-Sharma" },
]
keywords = ["cosmology", "cmb", "spectral-distortion", "thermalization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]
notebook = ["matplotlib", "jupyter"]
dev = ["matplotlib", "jupyter", "pytest", "mutmut"]
doc = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "nbsphinx>=0.9",
    "nbsphinx-link>=1.3",
    "sphinx-copybutton>=0.5",
    "ipython",
]

# NOTE: Publication-quality plots (apply_style with usetex=True) require
# a LaTeX installation with dvipng and the cm-super font package.
# Install via your system package manager or conda:
#
#   conda install -c conda-forge texlive-core dvipng cm-super
#
# On Debian/Ubuntu:
#   sudo apt install texlive-latex-extra dvipng cm-super
#
# On macOS (Homebrew):
#   brew install --cask mactex-no-gui

[project.urls]
Repository = "https://github.com/bakerem/spectroxide"
Issues = "https://github.com/bakerem/spectroxide/issues"

[tool.setuptools.packages.find]
include = ["spectroxide*"]

# Mutation testing (Workstream R2.5, dev/PLAN_VALIDATION_ROUND2). mutmut 3.6.0.
# Scoped to the four modules that produce the paper's published FIRAS/photon
# limits — the limit-proximate Python that Rust-only mutation testing misses.
# mutmut copies source to python/mutants/ and runs there; the real tree is safe.
# Run: cd python && mutmut run --max-children 2   (base miniforge env).
[tool.mutmut]
source_paths = ["spectroxide"]
only_mutate = [
    "spectroxide/firas.py",
    "spectroxide/greens.py",
    "spectroxide/dark_photon.py",
    "spectroxide/greens_table.py",
]
# Deterministic, fast, limit-relevant tests. Kept off the plotting/notebook and
# slow-subprocess suites so per-mutant time stays low (R2.5).
pytest_add_cli_args_test_selection = [
    "tests/test_firas.py",
    "tests/test_greens.py",
    "tests/test_greens_table.py",
    "tests/test_parity.py",
]
# Mutate the whole of each target module, not just git-changed lines.
use_git_change_detection = false
